name: Nuxt 4 migration

on:
  push:
    branches: [2026-redesign]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Migrate to Nuxt 4'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 2026-redesign

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Move application to Nuxt 4 structure
        run: |
          mkdir -p app
          git mv app.vue app/app.vue
          git mv assets app/assets
          git mv components app/components
          git mv composables app/composables
          git mv pages app/pages
          git mv stores app/stores
          mkdir -p app/types app/utils
          git mv types.d.ts app/types/project.ts

      - name: Apply Nuxt 4 compatibility changes
        run: |
          python - <<'PY'
          from pathlib import Path

          for file_name in [
              'app/stores/projects.ts',
              'app/components/index/projects/ProjectCards.vue',
              'app/components/index/projects/ProjectSidebar.vue',
          ]:
              path = Path(file_name)
              text = path.read_text()
              text = text.replace("import type { Project } from '@/types';", "import type { Project } from '~/types/project';")
              path.write_text(text)

          sidebar = Path('app/components/index/projects/ProjectSidebar.vue')
          text = sidebar.read_text()
          old = """const activeProject = computed(() => {
            const filteredProjects = sidebarProjects.filter((project: Project) => project.heading === store.activeProject);
            return filteredProjects[0];
          });"""
          new = """const activeProject = computed(() => {
            return sidebarProjects.find((project: Project) => project.heading === store.activeProject)!;
          });"""
          if old not in text:
              raise SystemExit('Expected ProjectSidebar lookup block was not found')
          sidebar.write_text(text.replace(old, new))
          PY

          cat > app/components/hero/BackgroundParticles.vue <<'EOF'
          <template>
            <ClientOnly>
              <vue-particles id="hero-particles" :options="options" />
            </ClientOnly>
          </template>

          <script setup lang="ts">
          import type { ISourceOptions } from '@tsparticles/engine';

          const options: ISourceOptions = {
            fullScreen: {
              enable: false,
              zIndex: -1,
            },
            particles: {
              color: {
                value: '#ffffff',
              },
              links: {
                color: '#ffffff',
                distance: 150,
                enable: true,
                opacity: 0.1,
                width: 1,
              },
              move: {
                enable: true,
                outModes: 'bounce',
              },
              number: {
                density: {
                  enable: true,
                },
                value: 100,
              },
              opacity: {
                value: 0.25,
              },
              size: {
                value: { min: 1, max: 2 },
              },
            },
          };
          </script>
          EOF

          cat > app/utils/particlesInit.ts <<'EOF'
          import type { Engine } from '@tsparticles/engine';

          export async function registerParticles(engine: Engine): Promise<void> {
            const { loadSlim } = await import('@tsparticles/slim');

            await loadSlim(engine);
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "files": [],
            "references": [
              { "path": "./.nuxt/tsconfig.app.json" },
              { "path": "./.nuxt/tsconfig.server.json" },
              { "path": "./.nuxt/tsconfig.shared.json" },
              { "path": "./.nuxt/tsconfig.node.json" }
            ]
          }
          EOF

          cat > nuxt.config.ts <<'EOF'
          export default defineNuxtConfig({
            typescript: {
              shim: false,
              tsConfig: {
                compilerOptions: {
                  noImplicitOverride: true,
                  noImplicitReturns: true,
                  noFallthroughCasesInSwitch: true,
                  forceConsistentCasingInFileNames: true,
                  skipLibCheck: true,
                },
              },
            },

            css: ['~/assets/main.css'],

            app: {
              head: {
                title: 'Josh Haywood | Full-Stack Software Engineer',
                meta: [
                  { charset: 'utf-8' },
                  {
                    key: 'description',
                    name: 'description',
                    content:
                      'Full-stack software engineer with 3+ years of commercial experience building and supporting production software across frontend, backend and data systems.',
                  },
                  { name: 'author', content: 'Josh Haywood' },
                  { name: 'google-site-verification', content: 'HdPWnU6uSFkgMmVnx4WWIkD2MX04xKkXY0lXaeSlMHk' },
                  { name: 'viewport', content: 'width=device-width, initial-scale=1' },
                ],
                link: [
                  {
                    rel: 'canonical',
                    href: 'https://www.joshhaywood-portfolio.com/',
                  },
                ],
                script: [
                  {
                    innerHTML: `
                      (function (c, l, a, r, i, t, y) {
                        c[a] = c[a] || function () {
                          (c[a].q = c[a].q || []).push(arguments);
                        };

                        t = l.createElement(r);
                        t.async = 1;
                        t.src = "https://www.clarity.ms/tag/" + i;
                        y = l.getElementsByTagName(r)[0];
                        y.parentNode.insertBefore(t, y);
                      })(window, document, "clarity", "script", "fmzcqh3it4");
                    `,
                    type: 'text/javascript',
                  },
                ],
              },
            },

            components: [
              {
                path: '~/components',
                pathPrefix: false,
              },
            ],

            modules: [
              '@pinia/nuxt',
              '@nuxt/image',
              '@tsparticles/nuxt4',
              '@vueuse/motion/nuxt',
              '@nuxtjs/tailwindcss',
              '@nuxtjs/eslint-module',
            ],
          });
          EOF

      - name: Update Nuxt 4 dependencies
        run: |
          npm uninstall nuxt-particles --package-lock-only
          npm install nuxt@^4.5.2 @nuxt/image@^2.1.0 vue-router@^5.3.1 pinia@^4.0.3 @pinia/nuxt@^1.0.2 @tsparticles/nuxt4 @tsparticles/vue3 @tsparticles/engine @tsparticles/slim --package-lock-only

      - name: Install migrated dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit migration to 2026-redesign
        run: |
          git rm .github/workflows/nuxt4-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate to Nuxt 4"
          git push origin HEAD:2026-redesign
